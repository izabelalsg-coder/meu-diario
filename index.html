let gAccessToken = null;
let gTokenClient = null;

async function silentRefresh(){
  return new Promise((resolve,reject)=>{
    try{
      const prev=gTokenClient.callback;
      gTokenClient.callback=(resp)=>{
        gTokenClient.callback=prev;
        if(resp.error){reject(new Error(resp.error));}
        else{gAccessToken=resp.access_token;resolve();}
      };
      gTokenClient.requestAccessToken({prompt:""});
    }catch(e){reject(e);}
  });
}

async function sheetsReq(path, method="GET", body=null){
  const doFetch=()=>fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}${path}`,{
    method, headers:{"Authorization":`Bearer ${gAccessToken}`,"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  let r=await doFetch();
  if(r.status===401){
    try{
      await silentRefresh();
      r=await doFetch();
    }catch{
      gAccessToken=null;
      throw new Error("Sessão expirada. Faça login novamente.");
    }
  }
  const data=await r.json();
  if(data.error) throw new Error("Google Sheets: "+( data.error.message||JSON.stringify(data.error)));
  return data;
}

  const d = await sheetsReq("/values/A1:A1");

function rowToEntry(r){

function entryToRow(e){

function toISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function pdi(iso){
  const d=new Date(iso);
  return{dn:d.getDate().toString().padStart(2,"0"),ms:MPT[d.getMonth()].slice(0,3).toLowerCase(),yr:d.getFullYear(),full:d.toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"}),iso:toISO(d)};
}
const dark=c=>c==="#1C1C1E"||c==="#1A2416";
function dc(bg){
  const map={
    "#FAF7F0":"#7A604A","#FFF0ED":"#A85040","#EFF8F4":"#3A7055","#EFF4FB":"#3A5A90","#F3EFF9":"#584A90",
    "#1C1C1E":"rgba(255,255,255,0.68)","#1A2416":"rgba(255,255,255,0.65)","#FFFFFF":"#000","#000000":"#fff",
  };
  if(map[bg])return map[bg];
  // Para qualquer cor pastel fora do mapa, calcula um tom mais escuro/saturado
  try{
    const r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16);
    // Escurece 40% e satura levemente
    const darken=v=>Math.max(0,Math.round(v*0.55));
    return`rgb(${darken(r)},${darken(g)},${darken(b)})`;
  }catch{return"#1a1410";}
}

function fileToCompressedDataURL(file,maxW=240,quality=0.65){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Erro ao ler o arquivo."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Erro ao processar a imagem."));
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function devoToCanvas(entry){

  const el=document.createElement("div");

  const titleSpan=document.createElement("span");titleSpan.style.cssText="font-family:'Dancing Script',cursive;font-size:42px;color:#9070B0;";titleSpan.textContent="Devocional";

  dateBox.appendChild(datePill);dateBox.appendChild(moodSpan);
  hdr.appendChild(titleSpan);hdr.appendChild(dateBox);el.appendChild(hdr);

  // Row 1: Gratidão + Oração
  const row1=document.createElement("div");row1.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:14px;";
  row1.appendChild(mkSection("Motivos de Gratidão","#D4B8F0","#5A3880","#BFA8DC",120,cv.gratidao||""));
  row1.appendChild(mkSection("Pedidos de Oração","#B8D8F0","#2A5878","#90BCDC",120,cv.oracao_pedidos||""));

/* ── EXPORTAR INSTAGRAM ─────────────────────────────────────── */
async function exportInstagram(entry,fmt){
  const dims={post:{w:1080,h:1350},story:{w:1080,h:1920}};
  const{w:tW,h:tH}=dims[fmt];const SCALE=2;
  const rW=tW/SCALE,rH=tH/SCALE;
  const{dn,ms,yr}=pdi(entry.date);
  const dk=dark(entry.bg||"#FAF7F0");
  const tc=dk?"rgba(255,255,255,0.92)":"#1a1410";
  const d=dc(entry.bg||"#FAF7F0");
  const el=document.createElement("div");
  el.style.cssText=`position:fixed;left:-9999px;top:0;width:${rW}px;height:${rH}px;background:${entry.bg||"#FAF7F0"};display:flex;flex-direction:column;padding:60px 56px 52px;`;
  const ctr=document.createElement("div");ctr.style.cssText="flex:1;display:flex;align-items:center;justify-content:center;";
  const p=document.createElement("p");
  p.style.cssText=`font-family:${entry.font||"'Lora',Georgia,serif"};font-size:${(entry.fontSize||17)+6}px;line-height:1.92;color:${tc};margin:0;white-space:pre-wrap;word-break:break-word;text-align:center;width:100%;`;
  p.textContent=entry.content;ctr.appendChild(p);el.appendChild(ctr);
  const dd=document.createElement("div");dd.style.cssText="display:flex;align-items:baseline;gap:10px;margin-top:32px;";
  const ds=document.createElement("span");ds.style.cssText=`font-family:'Playfair Display',serif;font-size:72px;font-weight:700;color:${d};line-height:1;`;ds.textContent=dn;
  const dm=document.createElement("div");dm.innerHTML=`<div style="font-size:16px;color:${d};line-height:1.3;">${ms}.</div><div style="font-size:16px;color:${d};line-height:1.3;">${yr}</div>`;
  dd.appendChild(ds);dd.appendChild(dm);el.appendChild(dd);
  document.body.appendChild(el);
  try{
    const canvas=await window.html2canvas(el,{scale:SCALE,width:rW,height:rH,useCORS:true,backgroundColor:entry.bg||"#FAF7F0",logging:false});
    const a=document.createElement("a");
    a.download=`frase-${fmt==="story"?"1080x1920":"1080x1350"}-${Date.now()}.png`;
    a.href=canvas.toDataURL("image/png");a.click();
  }finally{document.body.removeChild(el);}
}

/* ── CALENDÁRIO ─────────────────────────────────────────────── */
function Cal({entries,sel,onSel}){
  const [view,sv]=useState(new Date());
  const yr=view.getFullYear(),mo=view.getMonth();
  const first=new Date(yr,mo,1).getDay(),total=new Date(yr,mo+1,0).getDate();
  const today=new Date();
  const diaryDates=useMemo(()=>new Set(entries.filter(e=>!e.type||e.type==="diary").map(e=>{const d=new Date(e.date);return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;})),[entries]);
  const fraseDates=useMemo(()=>new Set(entries.filter(e=>e.type==="frase").map(e=>{const d=new Date(e.date);return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;})),[entries]);
  const devoDates=useMemo(()=>new Set(entries.filter(e=>e.type==="devo").map(e=>{const d=new Date(e.date);return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;})),[entries]);
  const cells=[...Array(first).fill(null),...Array.from({length:total},(_,i)=>i+1)];
  const isSel=d=>d&&sel&&d===sel.getDate()&&mo===sel.getMonth()&&yr===sel.getFullYear();
  const isT=d=>d===today.getDate()&&mo===today.getMonth()&&yr===today.getFullYear();
  const nb={background:"none",border:"none",cursor:"pointer",fontSize:"18px",color:TERRACOTTA,padding:"0 6px",lineHeight:1};
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
        <button onClick={()=>sv(new Date(yr,mo-1,1))} style={nb}>‹</button>
        <span style={{fontFamily:"'Playfair Display',serif",fontSize:"13px",color:"#3a2e26",fontWeight:600}}>{MPT[mo].slice(0,3)} {yr}</span>
        <button onClick={()=>sv(new Date(yr,mo+1,1))} style={nb}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}}>
        {DS.map((w,i)=><div key={i} style={{textAlign:"center",fontSize:"9px",color:"#c5b8a8",fontWeight:700,padding:"3px 0"}}>{w}</div>)}
        {cells.map((d,i)=>{
          const hasDiary=d&&diaryDates.has(`${yr}-${mo}-${d}`);
          const hasFrase=d&&fraseDates.has(`${yr}-${mo}-${d}`);
          const hasDevo=d&&devoDates.has(`${yr}-${mo}-${d}`);
          return(
            <div key={i} onClick={()=>d&&onSel(new Date(yr,mo,d))}
              style={{position:"relative",textAlign:"center",padding:"5px 2px",paddingBottom:"8px",borderRadius:"7px",fontSize:"11px",cursor:d?"pointer":"default",
                background:isSel(d)?TERRACOTTA:isT(d)?"#F5EDE0":"transparent",
                color:isSel(d)?"white":isT(d)?TERRACOTTA:"#3a2e26",
                fontWeight:(isSel(d)||isT(d))?700:400}}>
              {d||""}
              {d&&(hasDiary||hasFrase||hasDevo)&&!isSel(d)&&(
                <div style={{position:"absolute",bottom:"2px",left:"50%",transform:"translateX(-50%)",display:"flex",gap:"2px",alignItems:"center"}}>
                  {hasDiary&&<span style={{width:"3px",height:"3px",borderRadius:"50%",background:TERRACOTTA,display:"block"}}/>}
                  {hasFrase&&<span style={{width:"3px",height:"3px",borderRadius:"50%",background:LILAC,display:"block"}}/>}
                  {hasDevo&&<span style={{width:"3px",height:"3px",borderRadius:"50%",background:AMBER,display:"block"}}/>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── MODAL DE BACKUP ────────────────────────────────────────── */
function BackupModal({entries,livros,user,onImport,onClose}){
  const[importing,si]=useState(false);
  const[exporting,sex]=useState(false);
  const[msg,sm]=useState("");
  const fileRef=useRef(null);
  const livrosList=livros||[];

  const exportToDrive=async()=>{
    sex(true);sm("Salvando no Drive…");
    try{
      const fileName=`meu-diario-backup-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`;
      const data={version:2,exported_at:new Date().toISOString(),user:user?.email,entries:entries,livros:livrosList};
      const content=JSON.stringify(data,null,2);

      // Find or create "Meu Diário" folder
      const searchResp=await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name%3D'Meu+Di%C3%A1rio'+and+mimeType%3D'application%2Fvnd.google-apps.folder'+and+trashed%3Dfalse&fields=files(id,name)`,
        {headers:{Authorization:`Bearer ${gAccessToken}`}}
      );
      const searchData=await searchResp.json();
      let folderId;
      if(searchData.files&&searchData.files.length>0){
        folderId=searchData.files[0].id;
      }else{
        // Create folder
        const createResp=await fetch("https://www.googleapis.com/drive/v3/files",{
          method:"POST",
          headers:{Authorization:`Bearer ${gAccessToken}`,"Content-Type":"application/json"},
          body:JSON.stringify({name:"Meu Diário",mimeType:"application/vnd.google-apps.folder"})
        });
        const createData=await createResp.json();
        folderId=createData.id;
      }

      // Upload file using multipart
      const boundary="diary_backup_boundary";
      const metadata=JSON.stringify({name:fileName,parents:[folderId]});
      const body=[
        `--${boundary}`,
        "Content-Type: application/json; charset=UTF-8",
        "",
        metadata,
        `--${boundary}`,
        "Content-Type: application/json",
        "",
        content,
        `--${boundary}--`
      ].join("\r\n");

      const uploadResp=await fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
        {method:"POST",headers:{Authorization:`Bearer ${gAccessToken}`,
          "Content-Type":`multipart/related; boundary=${boundary}`},body}
      );
      const uploadData=await uploadResp.json();
      if(uploadData.id){
        sm(`✓ Backup salvo na pasta "Meu Diário" do Drive!`);
      }else{
        sm("Erro ao salvar no Drive. Tente novamente.");
      }
    }catch(err){sm("Erro: "+err.message);}
    sex(false);
  };

  const importJSON=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    si(true);sm("Importando…");
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(!data.entries||!Array.isArray(data.entries)){sm("Arquivo inválido.");si(false);return;}

      // Busca IDs existentes na planilha
      const existing=await sheetsReq("/values/A2:A");
      const existingIds=new Set((existing.values||[]).map(r=>r[0]).filter(Boolean));

      // Separa entradas novas das que já existem
      const newEntries=data.entries.filter(e=>!existingIds.has(e.id));
      const updateEntries=data.entries.filter(e=>existingIds.has(e.id));

      // Salva todas as entradas novas em uma única chamada
      if(newEntries.length>0){
        await sheetsReq(
          "/values/A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",
          "POST",
          {values:newEntries.map(entryToRow)}
        );
      }

      // Atualiza entradas existentes individualmente (geralmente poucas)
      if(updateEntries.length>0){
        const allRows=await sheetsReq("/values/A2:A");
        const rows=(allRows.values||[]);
        for(const entry of updateEntries){
          const idx=rows.findIndex(r=>r[0]===entry.id);
          if(idx!==-1){
            await sheetsReq(
              `/values/A${idx+2}:I${idx+2}?valueInputOption=RAW`,
              "PUT",
              {values:[entryToRow(entry)]}
            );
          }
        }
      }

      // Restaura livros, se o backup tiver (aba separada "Livros", nunca mexe na aba do diário)
      let importedLivros=[];
      if(Array.isArray(data.livros)&&data.livros.length>0){
        await ensureLivrosSheet();
        const existingL=await sheetsReq(`/values/${LIVROS_SHEET}!A2:A`);
        const existingLIds=new Set((existingL.values||[]).map(r=>r[0]).filter(Boolean));
        const newLivros=data.livros.filter(b=>!existingLIds.has(b.id));
        const updateLivros=data.livros.filter(b=>existingLIds.has(b.id));
        if(newLivros.length>0){
          await sheetsReq(`/values/${LIVROS_SHEET}!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,"POST",
            {values:newLivros.map(livroToRow)});
        }
        if(updateLivros.length>0){
          const allLRows=await sheetsReq(`/values/${LIVROS_SHEET}!A2:A`);
          const lrows=(allLRows.values||[]);
          for(const b of updateLivros){
            const idx=lrows.findIndex(r=>r[0]===b.id);
            if(idx!==-1){
              await sheetsReq(`/values/${LIVROS_SHEET}!A${idx+2}:P${idx+2}?valueInputOption=RAW`,"PUT",{values:[livroToRow(b)]});
            }
          }
        }
        importedLivros=data.livros;
      }

      onImport(data.entries,importedLivros);
      sm(`✓ ${data.entries.length} entradas${importedLivros.length?` e ${importedLivros.length} livros`:""} restaurados com sucesso!`);
    }catch(err){sm("Erro ao importar: "+err.message);}
    si(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.44)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:"20px"}}>
      <div className="slide-up" style={{background:"white",borderRadius:"24px",padding:"36px 30px",width:"100%",maxWidth:"420px",boxShadow:"0 16px 60px rgba(0,0,0,0.18)"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"22px",color:"#1a1410",marginBottom:"6px"}}>Backup do Diário</h2>
        <p style={{fontSize:"13px",color:"#b5a898",marginBottom:"24px",fontStyle:"italic"}}>Salve seus dados localmente ou restaure de um backup anterior.</p>

        {/* Exportar para Drive */}
        <div style={{background:"#F5EDE0",borderRadius:"14px",padding:"18px",marginBottom:"12px"}}>
          <p style={{fontFamily:"'Playfair Display',serif",fontSize:"15px",color:"#1a1410",marginBottom:"4px"}}>☁️ Salvar backup no Drive</p>
          <p style={{fontSize:"12px",color:"#8a7d70",marginBottom:"12px"}}>Salva um arquivo JSON na pasta "Meu Diário" do seu Google Drive automaticamente.</p>
          <button onClick={exportToDrive} disabled={exporting} style={{width:"100%",padding:"11px",background:exporting?"#d4a090":TERRACOTTA,border:"none",borderRadius:"11px",fontSize:"14px",cursor:exporting?"default":"pointer",fontFamily:"'Playfair Display',serif",color:"white"}}>
            {exporting?"Salvando…":`Salvar no Drive (${entries.length} entradas, ${livrosList.length} livros)`}
          </button>
        </div>

        {/* Importar */}
        <div style={{background:"#F0EAF8",borderRadius:"14px",padding:"18px",marginBottom:"16px"}}>
          <p style={{fontFamily:"'Playfair Display',serif",fontSize:"15px",color:"#1a1410",marginBottom:"4px"}}>⬆ Restaurar backup</p>
          <p style={{fontSize:"12px",color:"#8a7d70",marginBottom:"12px"}}>Selecione um arquivo de backup JSON gerado anteriormente por este app.</p>
          <input ref={fileRef} type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current?.click()} disabled={importing} style={{width:"100%",padding:"11px",background:"#9070B0",border:"none",borderRadius:"11px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif",color:"white",opacity:importing?0.6:1}}>
            {importing?"Importando…":"Selecionar arquivo JSON"}
          </button>
        </div>

        {msg&&<p style={{fontSize:"13px",color:msg.startsWith("✓")?TERRACOTTA:"#C06060",textAlign:"center",marginBottom:"12px"}}>{msg}</p>}

        <button onClick={onClose} style={{width:"100%",padding:"12px",background:"#F5EDE0",border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#6a5a4a"}}>Fechar</button>
      </div>
    </div>
  );
}

/* ── MODAL PDF ──────────────────────────────────────────────── */
function PdfModal({entries,onClose}){
  const sorted=useMemo(()=>[...entries].sort((a,b)=>new Date(a.date)-new Date(b.date)),[entries]);
  const minD=sorted.length?pdi(sorted[0].date).iso:"";const maxD=sorted.length?pdi(sorted[sorted.length-1].date).iso:"";
  const[from,sf]=useState(minD);const[to,st]=useState(maxD);
  const[allDates,sad]=useState(true);
  const[typeFilter,stf]=useState("both");
  const[busy,sbz]=useState(false);const[prog,sp]=useState(0);
  const inp2={padding:"9px 12px",border:"1.5px solid #EAE0D8",borderRadius:"10px",fontSize:"13px",fontFamily:"'Lora',serif",color:"#1a1410",background:"#FDFAF7",outline:"none",width:"100%"};
  const diaryCount=sorted.filter(e=>!e.type||e.type==="diary").length;
  const fraseCount=sorted.filter(e=>e.type==="frase").length;
  const devoCount=sorted.filter(e=>e.type==="devo").length;
  const typeBtn=(val,label,count)=>(
    <button onClick={()=>stf(val)} style={{flex:1,padding:"10px 4px",borderRadius:"10px",border:`2px solid ${typeFilter===val?TERRACOTTA:"#EAE0D8"}`,background:typeFilter===val?"#FFF5F0":"white",cursor:"pointer",fontFamily:"'Lora',serif",fontSize:"11px",color:typeFilter===val?TERRACOTTA:"#6a5a4a",fontWeight:typeFilter===val?700:400,transition:"all .15s",textAlign:"center"}}>
      {label}<br/><span style={{fontSize:"10px",opacity:0.65}}>{count} entr.</span>
    </button>
  );
  const gen=async()=>{
    let sel=sorted;
    if(typeFilter==="diary") sel=sel.filter(e=>!e.type||e.type==="diary");
    else if(typeFilter==="frases") sel=sel.filter(e=>e.type==="frase");
    else if(typeFilter==="devo") sel=sel.filter(e=>e.type==="devo");
    if(!allDates) sel=sel.filter(e=>{const iso=pdi(e.date).iso;return iso>=from&&iso<=to;});
    if(!sel.length){alert("Nenhuma entrada no filtro selecionado.");return;}
    sbz(true);sp(0);
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const pw=pdf.internal.pageSize.getWidth()-20;const ph=pdf.internal.pageSize.getHeight()-20;
    for(let i=0;i<sel.length;i++){sp(Math.round((i/sel.length)*100));const canvas=await entryToCanvas(sel[i]);const ih=(canvas.height/canvas.width)*pw;if(i>0)pdf.addPage();pdf.addImage(canvas.toDataURL("image/png"),"PNG",10,10,pw,Math.min(ih,ph));}
    sp(100);
    const suffix=typeFilter==="diary"?"diario":typeFilter==="frases"?"frases":typeFilter==="devo"?"devocional":"completo";
    pdf.save(`meu-diario-${suffix}-${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.pdf`);
    sbz(false);onClose();
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.44)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:"20px"}}>
      <div className="slide-up" style={{background:"white",borderRadius:"24px",padding:"36px 30px",width:"100%",maxWidth:"420px",boxShadow:"0 16px 60px rgba(0,0,0,0.18)"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"22px",color:"#1a1410",marginBottom:"6px"}}>Exportar PDF</h2>
        <p style={{fontSize:"13px",color:"#b5a898",marginBottom:"20px",fontStyle:"italic"}}>Escolha o conteúdo e o período.</p>
        <p style={{fontSize:"10px",color:"#b5a898",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"8px"}}>Conteúdo</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"20px"}}>
          {typeBtn("both","📖🌸✝️ Tudo",sorted.length)}
          {typeBtn("diary","📖 Diário",diaryCount)}
          {typeBtn("frases","🌸 Frases",fraseCount)}
          {typeBtn("devo","✝️ Devocional",devoCount)}
        </div>
        <label style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px",cursor:"pointer"}} onClick={()=>sad(!allDates)}>
          <div style={{width:"20px",height:"20px",borderRadius:"6px",border:`2px solid ${allDates?TERRACOTTA:"#EAE0D8"}`,background:allDates?TERRACOTTA:"white",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .15s"}}>{allDates&&<span style={{color:"white",fontSize:"12px",lineHeight:1}}>✓</span>}</div>
          <span style={{fontSize:"14px",color:"#3a2e26"}}>Todo o período</span>
        </label>
        {!allDates&&(<div style={{display:"flex",flexDirection:"column",gap:"12px",marginBottom:"16px",padding:"16px",background:"#FAF7F0",borderRadius:"14px"}}>
          <div><p style={{fontSize:"10px",color:"#b5a898",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"6px"}}>De</p><input type="date" value={from} onChange={e=>sf(e.target.value)} min={minD} max={to||maxD} style={inp2}/></div>
          <div><p style={{fontSize:"10px",color:"#b5a898",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"6px"}}>Até</p><input type="date" value={to} onChange={e=>st(e.target.value)} min={from||minD} max={maxD} style={inp2}/></div>
        </div>)}
        {busy&&(<div style={{marginBottom:"16px"}}><div style={{height:"4px",background:"#EDE5DC",borderRadius:"4px",overflow:"hidden"}}><div style={{height:"100%",background:TERRACOTTA,borderRadius:"4px",width:`${prog}%`,transition:"width .25s"}}/></div><p style={{fontSize:"11px",color:"#b5a898",marginTop:"6px",textAlign:"center"}}>Gerando… {prog}%</p></div>)}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} disabled={busy} style={{flex:1,padding:"12px",background:"#F5EDE0",border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#6a5a4a"}}>Cancelar</button>
          <button onClick={gen} disabled={busy} style={{flex:2,padding:"12px",background:TERRACOTTA,border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif",color:"white"}}>{busy?"Gerando…":"📄 Exportar PDF"}</button>
        </div>
      </div>
    </div>
  );
}

  const[selDate,ssd]=useState(initDate);
  const[mood,sm]=useState(initCv.mood||"");

  const[leitura,sl]=useState(initCv.leitura||"");
  const[licao1,sl1]=useState(initCv.licao1||"");
  const[licao2,sl2]=useState(initCv.licao2||"");
  const[licao3,sl3]=useState(initCv.licao3||"");

    const e={id:entry?entry.id:Date.now().toString(),date:selDate.toISOString(),content,tags:[],font:"'Lora',Georgia,serif",bg:"#F9F5FB",fontSize:14,createdAt:entry?entry.createdAt:new Date().toISOString(),type:"devo"};

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F9F5FB",overflow:"hidden"}}>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px",background:"rgba(255,255,255,0.9)",backdropFilter:"blur(12px)",borderBottom:"1px solid #E8D8F0",flexShrink:0}}>

      <div style={{flex:1,overflowY:"auto",padding:mob?"12px 14px":"20px 28px"}}>

              <Label txt="3 Lições que Aprendi" bg="#B8E0D0" color="#1A6050"/>

            </div>
          </div>

          {/* Anotações */}

            <Label txt="Minhas Anotações" bg="#F0C8C0" color="#883830"/>
            <div style={boxStyle("#E89898")}>
              <textarea value={anotacoes} onChange={e=>san(e.target.value)} placeholder="Suas anotações livres…" style={{...taStyle,minHeight:"110px"}}/>
            </div>
          </div>

          <p style={{textAlign:"center",fontSize:"10px",color:"#a090b0",letterSpacing:"1px",fontFamily:"'DM Sans',sans-serif"}}>@IZABELALGONCALVES</p>
        </div>
      </div>
    </div>
  );
}

  const devos=entries.filter(e=>e.type==="devo").sort((a,b)=>new Date(b.date)-new Date(a.date));

            <div key={m}>
              <div style={{fontSize:"9px",color:"#c5b8a8",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",padding:"10px 4px 5px"}}>{m}</div>
              {es.map(e=><DevoCard key={e.id} entry={e} active={selDevo?.id===e.id} onClick={()=>ss(e)}/>)}
            </div>
          ))}
        </div>
      </div>

      {/* Viewer */}
      {(!mob||selDevo)&&(
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {selDevo?(
            <DevoViewer entry={selDevo} viewRef={vRef} onEdit={()=>openEditor(selDevo)} onDel={async()=>{await onDel(selDevo.id);ss(null);}} onBack={()=>ss(null)} mob={mob} saving={false}/>
          ):(
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"10px",color:"#d5c8b8"}}>
              <div style={{fontSize:"48px"}}>✝️</div>
              <p style={{fontFamily:"'Playfair Display',serif",fontSize:"20px",color:"#b5a898"}}>Selecione um devocional</p>
              <button onClick={()=>openEditor(null)} style={{marginTop:"10px",background:AMBER,color:"white",border:"none",borderRadius:"14px",padding:"11px 26px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>Novo devocional</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


/* ── LIVROS: CARD ───────────────────────────────────────────── */
function LivroCard({livro,onClick,active}){

/* ── LIVROS: FORMULÁRIO ────────────────────────────────────── */
function LivroForm({livro,onSave,onCancel,onDelete}){
  const[title,sT]=useState(livro?.title||"");
  const[author,sA]=useState(livro?.author||"");
  const[cats,sCats]=useState(()=>{
    const base=[...LIVRO_CATS,...loadCustomCats()];
    if(livro?.category&&!base.includes(livro.category))base.splice(base.length-1,0,livro.category);
    return base;
  });
  const[category,sC]=useState(livro?.category||LIVRO_CATS[0]);
  const[addingCat,sAC]=useState(false);
  const[newCat,sNC]=useState("");
  const[format,sF]=useState(livro?.format||"fisico");
  const[status,sS]=useState(livro?.status||"quero");
  const[rating,sR]=useState(livro?.rating||0);
  const[startDate,sSD]=useState(livro?.startDate||"");
  const[endDate,sED]=useState(livro?.endDate||"");
  const[notes,sN]=useState(livro?.notes||"");
  const[extent,sExt]=useState(livro?.extent||"");
  const[mood,sMood]=useState(livro?.mood||"");
  const[cover,sCover]=useState(livro?.cover||"");
  const[coverBusy,sCB]=useState(false);
  const[cardColor,sCC]=useState(livro?.cardColor||getRandomLivroPastel());
  const[saving,ssav]=useState(false);
  const fileRef=useRef(null);

  const lbl={fontSize:"11px",color:"#8a7d70",fontWeight:600,marginBottom:"5px",display:"block"};
  const inp={width:"100%",padding:"10px 12px",border:"1px solid #EDE5DC",borderRadius:"10px",fontSize:"14px",fontFamily:"'Lora',serif",background:"#FAF7F0",marginBottom:"14px"};

  const addCategory=()=>{
    const v=newCat.trim();
    if(!v)return;
    if(!cats.includes(v)){
      const updated=[...cats.filter(c=>c!=="Outro"),v,"Outro"];
      sCats(updated);
      saveCustomCats(updated.filter(c=>!LIVRO_CATS.includes(c)));
    }
    sC(v);sNC("");sAC(false);
  };

  const handleCoverFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    sCB(true);
    try{const dataUrl=await fileToCompressedDataURL(file);sCover(dataUrl);}
    catch(err){alert(err.message);}
    sCB(false);
  };

  const save=async()=>{
    if(!title.trim()){alert("Digite ao menos o título do livro.");return;}
    ssav(true);
    const entry={id:livro?livro.id:Date.now().toString(),title:title.trim(),author:author.trim(),category,format,status,
      rating,startDate,endDate,quote:livro?.quote||"",notes,extent,mood,cover,cardColor,createdAt:livro?livro.createdAt:new Date().toISOString()};
    try{await onSave(entry);}
    catch(e){alert("Erro ao salvar: "+e.message);}
    ssav(false);
  };

  return(
    <div style={{padding:"20px 22px",maxWidth:"520px",overflowY:"auto",flex:1}}>
      <label style={lbl}>Capa do livro</label>
      <div style={{display:"flex",gap:"14px",alignItems:"center",marginBottom:"16px"}}>
        <div style={{width:"64px",height:"90px",borderRadius:"8px",background:"#F5EDE0",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",boxShadow:cover?"0 3px 10px rgba(0,0,0,0.15)":"none"}}>
          {cover?<img src={cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:"24px",color:"#d5c8b8"}}>📷</span>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleCoverFile} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current?.click()} disabled={coverBusy} style={{padding:"8px 14px",background:"#F5EDE0",border:"none",borderRadius:"10px",fontSize:"12px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#6a5a4a"}}>
            {coverBusy?"Processando…":cover?"Trocar foto":"Adicionar foto"}
          </button>
          {cover&&<button onClick={()=>sCover("")} style={{padding:"6px 14px",background:"none",border:"none",borderRadius:"10px",fontSize:"11px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#C06060"}}>Remover foto</button>}
        </div>
      </div>

      <label style={lbl}>Cor de fundo do card</label>
      <div style={{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}}>
        {LIVRO_PASTELS.map(c=>(
          <button key={c} onClick={()=>sCC(c)} title={c} style={{width:"26px",height:"26px",borderRadius:"50%",background:c,padding:0,flexShrink:0,border:cardColor===c?`2.5px solid ${TERRACOTTA}`:"1.5px solid rgba(0,0,0,0.10)",cursor:"pointer"}}/>
        ))}
      </div>

      <label style={lbl}>Título</label>
      <input style={inp} value={title} onChange={e=>sT(e.target.value)} placeholder="Nome do livro"/>

      <label style={lbl}>Autor</label>
      <input style={inp} value={author} onChange={e=>sA(e.target.value)} placeholder="Autor(a)"/>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
        <div>
          <label style={lbl}>Categoria</label>
          {!addingCat?(
            <select style={inp} value={category} onChange={e=>{if(e.target.value==="__nova__"){sAC(true);}else{sC(e.target.value);}}}>
              {cats.map(c=><option key={c} value={c}>{c}</option>)}
              <option value="__nova__">+ Nova categoria…</option>
            </select>
          ):(
            <div style={{display:"flex",gap:"6px",marginBottom:"14px"}}>
              <input autoFocus style={{...inp,marginBottom:0}} value={newCat} onChange={e=>sNC(e.target.value)} placeholder="Nome da categoria" onKeyDown={e=>e.key==="Enter"&&addCategory()}/>
              <button onClick={addCategory} style={{padding:"0 14px",background:SAGE,border:"none",borderRadius:"10px",color:"white",fontSize:"13px",cursor:"pointer"}}>OK</button>
            </div>
          )}
        </div>
        <div>
          <label style={lbl}>Formato</label>
          <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
            {[{k:"fisico",label:"📘 Físico"},{k:"audiolivro",label:"🎧 Áudio"}].map(f=>(
              <button key={f.k} onClick={()=>sF(f.k)} style={{flex:1,padding:"10px 6px",borderRadius:"10px",border:"1px solid #EDE5DC",cursor:"pointer",fontSize:"13px",fontFamily:"'Lora',serif",background:format===f.k?TERRACOTTA:"#FAF7F0",color:format===f.k?"white":"#6a5a4a"}}>{f.label}</button>
            ))}
          </div>
        </div>
      </div>

      <label style={lbl}>Status</label>
      <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
        {LIVRO_STATUS.map(s=>(
          <button key={s.k} onClick={()=>sS(s.k)} style={{flex:1,padding:"9px 6px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"12px",fontFamily:"'Lora',serif",fontWeight:status===s.k?700:400,background:status===s.k?s.color:"#F5EDE0",color:status===s.k?"white":"#8a7d70"}}>{s.label}</button>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
        <div>
          <label style={lbl}>Início da leitura</label>
          <input type="date" style={inp} value={startDate} onChange={e=>sSD(e.target.value)}/>
        </div>
        <div>
          <label style={lbl}>Fim da leitura</label>
          <input type="date" style={inp} value={endDate} onChange={e=>sED(e.target.value)}/>
        </div>
      </div>

      <label style={lbl}>{format==="audiolivro"?"Duração total":"Número de páginas"}</label>
      <input style={inp} value={extent} onChange={e=>sExt(e.target.value)} placeholder={format==="audiolivro"?"ex: 8h 32min":"ex: 312"}/>

      <label style={lbl}>Avaliação</label>
      <div style={{display:"flex",gap:"4px",marginBottom:"14px"}}>
        {[1,2,3,4,5].map(n=>(
          <span key={n} onClick={()=>sR(rating===n?0:n)} style={{fontSize:"24px",cursor:"pointer",color:n<=rating?AMBER:"#e0d4c8"}}>★</span>
        ))}
      </div>

      <label style={lbl}>Como essa leitura te fez sentir</label>
      <div style={{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
        {LIVRO_MOODS.map(m=>(
          <button key={m.k} onClick={()=>sMood(mood===m.k?"":m.k)} style={{padding:"7px 11px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"12px",fontFamily:"'Lora',serif",background:mood===m.k?m.color:"#F5EDE0",color:"#5a4d40"}}>{m.emoji} {m.label}</button>
        ))}
      </div>

      <label style={lbl}>Notas e impressões</label>
      <textarea style={{...inp,minHeight:"90px",resize:"vertical"}} value={notes} onChange={e=>sN(e.target.value)} placeholder="O que você achou, o que aprendeu..."/>

      <div style={{display:"flex",gap:"10px",marginTop:"6px"}}>
        <button onClick={onCancel} style={{flex:1,padding:"12px",background:"#F5EDE0",border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#6a5a4a"}}>Cancelar</button>
        {livro&&<button onClick={()=>onDelete(livro.id)} style={{padding:"12px 16px",background:"#F8E0E0",border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Lora',serif",color:"#C06060"}}>Excluir</button>}
        <button onClick={save} disabled={saving} style={{flex:1,padding:"12px",background:SAGE,border:"none",borderRadius:"12px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif",color:"white",opacity:saving?0.7:1}}>{saving?"Salvando…":"Salvar"}</button>
      </div>
    </div>
  );
}

/* ── LIVROS: ESTANTE 3D ────────────────────────────────────── */
function LivroShelf({livros,onClick,sel}){
  if(livros.length===0)return(
    <div style={{textAlign:"center",padding:"48px 0",color:"#d5c8b8"}}>
      <div style={{fontSize:"36px",marginBottom:"8px"}}>📚</div>
      <p style={{fontSize:"13px"}}>Nenhum livro por aqui ainda.</p>
    </div>
  );
  return(
    <div style={{padding:"6px 4px"}}>
      <div style={{display:"flex",flexWrap:"wrap",alignItems:"flex-end",gap:"5px",background:"#F5EDE0",borderRadius:"10px",padding:"16px 10px 0"}}>
        {livros.map(l=>{
          const h=90+((l.title.length*7)%45);
          const w=22+((l.author.length*3)%14);
          return(
            <div key={l.id} onClick={()=>onClick(l)} title={l.title}
              style={{width:w+"px",height:h+"px",background:l.cardColor?shiftColor(l.cardColor):"#D8C8B0",
                borderRadius:"3px 3px 0 0",cursor:"pointer",boxShadow:sel?.id===l.id?`0 0 0 2px ${TERRACOTTA}`:"inset -3px 0 5px rgba(0,0,0,0.12)",
                display:"flex",alignItems:"center",justifyContent:"center",writingMode:"vertical-rl",
                fontSize:"10px",color:"#5a4d40",overflow:"hidden",padding:"4px 0",fontFamily:"'Lora',serif"}}>
              {l.title.length>16?l.title.slice(0,15)+"…":l.title}
            </div>
          );
        })}
      </div>
      <div style={{height:"12px",background:"linear-gradient(180deg,#D9C3A3,#C4A578)",borderRadius:"0 0 6px 6px",boxShadow:"0 3px 6px rgba(0,0,0,0.12)"}}/>
      <p style={{textAlign:"center",fontSize:"11px",color:"#c5b8a8",padding:"8px 0 0",fontStyle:"italic"}}>toque numa lombada para abrir o livro</p>
    </div>
  );
}
function shiftColor(hex){
  // escurece levemente uma cor pastel para simular a lombada do livro
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,((n>>16)&255)-14),g=Math.max(0,((n>>8)&255)-14),b=Math.max(0,(n&255)-14);
  return`rgb(${r},${g},${b})`;
}

/* ── LIVROS: MAPA DE HUMOR ─────────────────────────────────── */
function LivroMoodMap({livros}){
  const lidos=livros.filter(l=>l.status==="lido").slice().sort((a,b)=>new Date(a.endDate||a.createdAt)-new Date(b.endDate||b.createdAt));
  if(lidos.length===0)return(
    <div style={{textAlign:"center",padding:"48px 0",color:"#d5c8b8"}}>
      <div style={{fontSize:"36px",marginBottom:"8px"}}>🕊️</div>
      <p style={{fontSize:"13px"}}>Nenhuma leitura concluída registrada ainda.</p>
      <p style={{fontSize:"12px",marginTop:"4px",color:"#e0d4c8"}}>Marque livros como "Concluído" e registre como eles te fizeram sentir.</p>
    </div>
  );
  return(
    <div style={{padding:"14px"}}>
      <p style={{fontSize:"12px",color:"#8a7d70",marginBottom:"12px"}}>Como suas leituras concluídas te fizeram sentir, em ordem cronológica.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginBottom:"20px"}}>
        {lidos.map(l=>{
          const m=LIVRO_MOODS.find(x=>x.k===l.mood);
          return(
            <div key={l.id} title={l.title} style={{width:"38px",height:"38px",borderRadius:"10px",background:m?m.color:"#EDE5DC",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",cursor:"default"}}>
              {m?m.emoji:"·"}
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
        {LIVRO_MOODS.map(m=>{
          const count=lidos.filter(l=>l.mood===m.k).length;
          if(count===0)return null;
          return(
            <div key={m.k} style={{display:"flex",alignItems:"center",gap:"8px"}}>
              <div style={{width:"16px",height:"16px",borderRadius:"5px",background:m.color,flexShrink:0}}/>
              <span style={{fontSize:"12px",color:"#6a5a4a"}}>{m.emoji} {m.label}</span>
              <span style={{fontSize:"11px",color:"#c5b8a8"}}>({count})</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── LIVROS: SEÇÃO ─────────────────────────────────────────── */
function LivrosSection({livros,onSave,onDel,mob}){
  const[sel,ss]=useState(null);
  const[editing,se_]=useState(false);
  const[filter,sf]=useState("todos");
  const[view,sv]=useState("lista");

  const filtered = filter==="todos" ? livros : livros.filter(l=>l.status===filter);
  const counts = {todos:livros.length,quero:livros.filter(l=>l.status==="quero").length,
    lendo:livros.filter(l=>l.status==="lendo").length,lido:livros.filter(l=>l.status==="lido").length};

  const openNew=()=>{ss(null);se_(true);};
  const openEdit=(l)=>{ss(l);se_(true);};
  const handleSave=async(entry)=>{await onSave(entry);se_(false);ss(null);};
  const handleDel=async(id)=>{await onDel(id);se_(false);ss(null);};

  return(
    <div style={{display:"flex",height:"100%",overflow:"hidden"}}>
      <div style={{width:mob?"100%":"320px",minWidth:mob?"100%":"320px",display:mob&&editing?"none":"flex",flexDirection:"column",borderRight:mob?"none":"1px solid #EDE5DC",background:"white",overflow:"hidden"}}>
        <div style={{padding:"18px 18px 12px",borderBottom:"1px solid #EDE5DC",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"17px",color:"#1a1410"}}>📚 Leituras</h2>
            <p style={{fontSize:"11px",color:"#c5b8a8",fontStyle:"italic",marginTop:"2px"}}>{livros.length} {livros.length===1?"livro":"livros"}</p>
          </div>
          <button onClick={openNew} style={{background:SAGE,color:"white",border:"none",borderRadius:"10px",padding:"7px 13px",fontSize:"12px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>+ Novo</button>
        </div>
        <div style={{display:"flex",gap:"5px",padding:"10px 14px 0"}}>
          {[{k:"lista",label:"📋 Lista"},{k:"estante",label:"📚 Estante"},{k:"humor",label:"🕊️ Humor"}].map(v=>(
            <button key={v.k} onClick={()=>sv(v.k)} style={{flex:1,padding:"6px 4px",borderRadius:"9px",border:"none",cursor:"pointer",fontSize:"11px",fontFamily:"'Lora',serif",fontWeight:view===v.k?700:400,background:view===v.k?TERRACOTTA:"#F5EDE0",color:view===v.k?"white":"#8a7d70"}}>{v.label}</button>
          ))}
        </div>
        {view!=="humor"&&(
          <div style={{display:"flex",gap:"5px",padding:"10px 14px 0",flexWrap:"wrap"}}>
            {[{k:"todos",label:"Todos"},...LIVRO_STATUS].map(s=>(
              <span key={s.k} onClick={()=>sf(s.k)} style={{fontSize:"11px",padding:"4px 9px",borderRadius:"8px",cursor:"pointer",background:filter===s.k?(s.color||TERRACOTTA):"#F5EDE0",color:filter===s.k?"white":"#8a7d70"}}>{s.label} ({counts[s.k]})</span>
            ))}
          </div>
        )}
        <div style={{flex:1,overflowY:"auto",padding:view==="lista"?"12px 14px":"12px 10px"}}>
          {view==="lista"&&(filtered.length===0?(
            <div style={{textAlign:"center",padding:"48px 0",color:"#d5c8b8"}}>
              <div style={{fontSize:"36px",marginBottom:"8px"}}>📚</div>
              <p style={{fontSize:"13px"}}>Nenhum livro por aqui ainda.</p>
              <p style={{fontSize:"12px",marginTop:"4px",color:"#e0d4c8"}}>Clique em "+ Novo" para registrar uma leitura.</p>
            </div>
          ):filtered.map(l=><LivroCard key={l.id} livro={l} active={sel?.id===l.id} onClick={()=>openEdit(l)}/>))}
          {view==="estante"&&<LivroShelf livros={filtered} onClick={openEdit} sel={sel}/>}
          {view==="humor"&&<LivroMoodMap livros={livros}/>}
        </div>
      </div>

      {(!mob||editing)&&(
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {editing?(
            <>
              {mob&&<div style={{padding:"14px 18px",borderBottom:"1px solid #EDE5DC",flexShrink:0}}>
                <button onClick={()=>{se_(false);ss(null);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:"13px",color:TERRACOTTA,fontFamily:"'Lora',serif"}}>‹ Voltar</button>
              </div>}
              <LivroForm livro={sel} onSave={handleSave} onCancel={()=>{se_(false);ss(null);}} onDelete={handleDel}/>
            </>
          ):(
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"10px",color:"#d5c8b8"}}>
              <div style={{fontSize:"48px"}}>📚</div>
              <p style={{fontFamily:"'Playfair Display',serif",fontSize:"20px",color:"#b5a898"}}>Selecione um livro</p>
              <button onClick={openNew} style={{marginTop:"10px",background:SAGE,color:"white",border:"none",borderRadius:"14px",padding:"11px 26px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>Registrar leitura</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── SIDEBAR ────────────────────────────────────────────────── */
function Sidebar({entries,user,selDate,setSel,stag,sstag,selEntry,setSE,open,logout,showPdf,showBackup,mob,onEntryClick,section,setSection}){
  const[tab,st]=useState("timeline");
  const diaryEntries=entries.filter(e=>!e.type||e.type==="diary");
  const tags=[...new Set(diaryEntries.flatMap(e=>e.tags||[]))];
  const fil=diaryEntries.filter(e=>!stag||(e.tags||[]).includes(stag)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const grp=fil.reduce((a,e)=>{const d=new Date(e.date);const k=`${MPT[d.getMonth()]} ${d.getFullYear()}`;(a[k]=a[k]||[]).push(e);return a;},{});
  const ch=active=>({fontSize:"11px",padding:"4px 9px",borderRadius:"8px",cursor:"pointer",userSelect:"none",background:active?TERRACOTTA:"#F5EDE0",color:active?"white":"#8a7d70"});

  /* tabs de seção */

    <div style={{display:"flex",gap:"6px",marginBottom:mob?"12px":"0",marginTop:mob?"12px":"0"}}>
      {[{k:"diary",icon:"📖",label:"Diário"},{k:"frases",icon:"🌸",label:"Frases"},{k:"devo",icon:"✝️",label:"Devo"},{k:"livros",icon:"📚",label:"Livros"}].map(({k,icon,label})=>(
        <button key={k} onClick={()=>setSection(k)}
          style={{flex:1,padding:"7px 0",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"11px",fontFamily:"'Lora',serif",fontWeight:section===k?700:400,
            background:section===k?(k==="frases"?"#EDD4FF":k==="devo"?"#F5E8C0":k==="livros"?SAGE:TERRACOTTA):"#F5EDE0",
            color:section===k?"white":"#8a7d70",transition:"all .15s"}}>
          {icon} {label}
        </button>

    </div>
  );

  const header=(
    <div style={{padding:mob?"18px 18px 12px":"22px 20px 16px",borderBottom:"1px solid #EDE5DC",flexShrink:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:mob?"22px":"20px",color:"#1a1410",letterSpacing:"-0.3px"}}>Meu Diário</h1>
          <p style={{fontSize:"11px",color:"#c5b8a8",marginTop:"2px",fontStyle:"italic"}}>{emailName(user?.email)}</p>
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          {mob&&<button onClick={showPdf} style={{background:"#F5EDE0",border:"none",borderRadius:"10px",padding:"8px 11px",fontSize:"12px",cursor:"pointer",color:"#6a5a4a",fontFamily:"'Lora',serif"}}>PDF</button>}
          <button onClick={()=>open(null,new Date())} style={{background:TERRACOTTA,color:"white",border:"none",borderRadius:"11px",padding:mob?"9px 14px":"8px 14px",fontSize:mob?"13px":"12px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>+ Nova</button>
        </div>
      </div>
      {mob&&<SecTabs/>}
      {mob&&section==="diary"&&(
        <div style={{display:"flex",gap:"8px",marginTop:"4px"}}>
          {["timeline","calendar"].map(t=>(
            <button key={t} onClick={()=>st(t)} style={{padding:"6px 14px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"12px",fontFamily:"'Lora',serif",fontWeight:tab===t?600:400,background:tab===t?TERRACOTTA:"#F5EDE0",color:tab===t?"white":"#8a7d70",transition:"all .15s"}}>
              {t==="timeline"?"Linha do tempo":"Calendário"}
            </button>
          ))}
        </div>
      )}
    </div>
  );

  const calSection=(
    <div style={{padding:mob?"0 0 16px":"14px 18px",borderBottom:mob?"none":"1px solid #EDE5DC"}}>
      <Cal entries={entries} sel={selDate} onSel={date=>{setSel(date);const f=entries.find(e=>(!e.type||e.type==="diary")&&(()=>{const d=new Date(e.date);return d.getDate()===date.getDate()&&d.getMonth()===date.getMonth()&&d.getFullYear()===date.getFullYear();})());if(f){setSE(f);if(onEntryClick)onEntryClick(f);}else setSE(null);}}/>
    </div>
  );

  const tagSection=tags.length>0&&(
    <div style={{padding:mob?"12px 0":"10px 18px",borderBottom:mob?"none":"1px solid #EDE5DC"}}>
      <p style={{fontSize:"9px",color:"#c5b8a8",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"7px"}}>Filtrar por tag</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>
        <span onClick={()=>sstag("")} style={ch(!stag)}>Todos</span>
        {tags.map(t=><span key={t} onClick={()=>sstag(stag===t?"":t)} style={ch(stag===t)}>#{t}</span>)}
      </div>
    </div>
  );

  const timeline=(
    <div style={{flex:1,overflowY:"auto",padding:mob?"12px 0":"8px 12px"}}>
      {Object.keys(grp).length===0?(
        <div style={{textAlign:"center",padding:mob?"48px 0":"36px 0",color:"#d5c8b8"}}>
          <div style={{fontSize:"36px",marginBottom:"8px"}}>🌿</div>
          <p style={{fontSize:"13px"}}>Nenhuma entrada ainda.</p>
          {mob&&<button onClick={()=>open(null,new Date())} style={{marginTop:"16px",background:TERRACOTTA,color:"white",border:"none",borderRadius:"12px",padding:"10px 24px",fontSize:"13px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>Começar agora</button>}
        </div>
      ):Object.entries(grp).map(([m,es])=>(
        <div key={m}>
          <div style={{fontSize:"9px",color:"#c5b8a8",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",padding:mob?"12px 0 6px":"10px 4px 5px"}}>{m}</div>
          {es.map(e=><EntryCard key={e.id} entry={e} active={selEntry?.id===e.id} onClick={()=>{setSE(e);if(onEntryClick)onEntryClick(e);}}/>)}
        </div>
      ))}
    </div>
  );

  if(mob){
    return(
      <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"white"}}>
        {header}
        <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>
          {section==="diary"&&(tab==="calendar"?<>{calSection}{tagSection}{timeline}</>:<>{tagSection}{timeline}</>)}
        </div>
        <div style={{borderTop:"1px solid #EDE5DC",padding:"10px 28px 14px",display:"flex",justifyContent:"space-around",alignItems:"center",background:"white",flexShrink:0}}>
          <button onClick={logout} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>🚪</span>Sair</button>
          <button onClick={()=>open(null,new Date())} style={{background:TERRACOTTA,color:"white",border:"none",borderRadius:"50%",width:"54px",height:"54px",fontSize:"28px",cursor:"pointer",boxShadow:"0 4px 16px rgba(196,120,90,0.4)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:"6px"}}>+</button>
          <button onClick={showPdf} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📄</span>PDF</button>
          <button onClick={showBackup} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#9070B0",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>💾</span>Backup</button>
        </div>
      </div>
    );
  }
  return(
    <aside style={{width:"300px",minWidth:"300px",background:"white",borderRight:"1px solid #EDE5DC",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {header}
      <div style={{padding:"10px 18px 8px",borderBottom:"1px solid #EDE5DC",flexShrink:0}}><SecTabs/></div>
      {section==="diary"&&<>{calSection}{tagSection}{timeline}</>}
      {section==="frases"&&(
        <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>
          <Cal entries={entries} sel={selDate} onSel={d=>setSel(d)}/>
        </div>
      )}
      {section==="devo"&&(
        <div style={{flex:1,overflowY:"auto",padding:"12px 14px"}}>
          <Cal entries={entries} sel={selDate} onSel={d=>setSel(d)}/>
        </div>
      )}
      {section==="livros"&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px",color:"#d5c8b8",textAlign:"center"}}>
          <div style={{fontSize:"32px",marginBottom:"8px"}}>📚</div>
          <p style={{fontSize:"12px"}}>Suas leituras aparecem no painel ao lado.</p>
        </div>
      )}
      <div style={{padding:"10px 18px",borderTop:"1px solid #EDE5DC",display:section==="livros"?"none":"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button onClick={logout} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif"}}>Sair da conta</button>
        <div style={{display:"flex",gap:"6px"}}>
          <button onClick={showPdf} style={{background:"#F5EDE0",border:"none",borderRadius:"9px",padding:"6px 12px",fontSize:"11px",cursor:"pointer",color:"#6a5a4a",fontFamily:"'Lora',serif"}}>📄 PDF</button>
          <button onClick={showBackup} style={{background:"#F0EAF8",border:"none",borderRadius:"9px",padding:"6px 12px",fontSize:"11px",cursor:"pointer",color:"#9070B0",fontFamily:"'Lora',serif"}}>💾 Backup</button>
        </div>
      </div>
    </aside>
  );
}

/* ── APP ────────────────────────────────────────────────────── */
function App(){
  const mob=useMob();
  const[scr,setSCR]=useState("loading");
  const[user,su]=useState(null);
  const[entries,se]=useState([]);
  const[livros,sliv]=useState([]);
  const[selEntry,sse]=useState(null);
  const[selDate,ssd]=useState(new Date());
  const[stag,sst]=useState("");
  const[ec,sec]=useState("");const[et,set]=useState([]);const[ef,sef]=useState(FONTS[0].value);
  const[ebg,sebg]=useState(BGS[0].v);const[efz,sefz]=useState(17);const[edit,sedit]=useState(null);
  const[pdfOpen,spdf]=useState(false);
  const[backupOpen,sbkp]=useState(false);
  const[mobEnt,sme]=useState(false);
  const[saving,ssav]=useState(false);
  const[section,setSec]=useState("diary");  // "diary" | "frases" | "devo"
  const[isFrase,sIF]=useState(false);
  const[devoEdit,sDE]=useState(null); // entry being edited in DevoEditor
  const[showDevoEd,sSDE]=useState(false);
  const vRef=useRef(null);

  useEffect(()=>{
    const initGoogle=()=>{
      if(!window.google){setTimeout(initGoogle,200);return;}
      gTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:SCOPES,
        callback:async(resp)=>{
          // Diagnóstico: confirma se callback é chamado
          if(!resp){alert("Callback chamado sem resposta.");setSCR("login");return;}
          if(resp.error){alert("Erro Google OAuth: "+resp.error);setSCR("login");return;}
          gAccessToken=resp.access_token;
          try{
            const ui=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",
              {headers:{Authorization:`Bearer ${gAccessToken}`}}).then(r=>r.json());
            if(ui.error){throw new Error("Userinfo: "+JSON.stringify(ui.error));}
            su(ui);
            await initSheet();
            const ents=await dbLoad();
            se(ents);
            setSCR("diary");
            try{const ls=await dbLoadLivros();sliv(ls);}catch(e){console.error("Livros:",e);}
          }catch(err){
            console.error(err);
            alert("Erro ao carregar dados:\n\n"+err.message+"\n\nVerifique se a API do Google Sheets está ativada no seu projeto Google Cloud.");
            setSCR("login");
          }
        }
      });
      setSCR("login");
    };
    initGoogle();
  },[]);

  /* auth handled by Google token callback in useEffect */

  const openEd=(entry=null,date=new Date(),frase=false)=>{
    sIF(frase);
    if(entry){sedit(entry);sec(entry.content);set(entry.tags||[]);sef(entry.font||FONTS[frase?1:0].value);sebg(entry.bg||(frase?getRandomPastel():BGS[0].v));sefz(entry.fontSize||(frase?15:17));ssd(new Date(entry.date));}
    else{sedit(null);sec("");set([]);sef(FONTS[frase?1:0].value);sebg(frase?getRandomPastel():BGS[0].v);sefz(frase?15:17);ssd(date);}
    setSCR("editor");
  };

  const saveEntry=async()=>{
    if(!ec.trim())return;ssav(true);
    const entry={id:edit?edit.id:Date.now().toString(),date:selDate.toISOString(),content:ec,tags:et,font:ef,bg:ebg,fontSize:efz,createdAt:edit?edit.createdAt:new Date().toISOString(),type:isFrase?"frase":"diary"};
    try{await dbSave(entry);const ne=edit?entries.map(x=>x.id===entry.id?entry:x):[...entries,entry];se(ne);sse(entry);if(mob)sme(true);setSCR("diary");}
    catch(e){alert("Erro ao salvar: "+e.message);}
    ssav(false);
  };

  const saveFrase=async(entry)=>{
    try{await dbSave(entry);se(prev=>prev.some(x=>x.id===entry.id)?prev.map(x=>x.id===entry.id?entry:x):[...prev,entry]);}
    catch(e){alert("Erro ao salvar: "+e.message);}
  };

  const saveDevo=async(entry)=>{
    try{await dbSave(entry);se(prev=>prev.some(x=>x.id===entry.id)?prev.map(x=>x.id===entry.id?entry:x):[...prev,entry]);sSDE(false);}
    catch(e){alert("Erro ao salvar: "+e.message);}
  };

  const del=async(id)=>{
    try{await dbDelete(id);se(prev=>prev.filter(e=>e.id!==id));sse(null);sme(false);}
    catch(e){alert("Erro ao excluir: "+e.message);}
  };

  const saveLivro=async(livro)=>{
    await dbSaveLivro(livro);
    sliv(prev=>prev.some(x=>x.id===livro.id)?prev.map(x=>x.id===livro.id?livro:x):[livro,...prev]);
  };

  const delLivro=async(id)=>{
    await dbDeleteLivro(id);
    sliv(prev=>prev.filter(l=>l.id!==id));
  };

  const png=async()=>{
    if(!vRef.current||!window.html2canvas){alert("Aguarde o carregamento.");return;}
    try{const c=await window.html2canvas(vRef.current,{scale:2,useCORS:true,backgroundColor:null,logging:false});const a=document.createElement("a");a.download=`diario-${new Date(selEntry?.date||Date.now()).toLocaleDateString("pt-BR").replace(/\//g,"-")}.png`;a.href=c.toDataURL("image/png");a.click();}
    catch{alert("Erro ao gerar imagem.");}
  };

  const logout=()=>{
    if(gAccessToken&&window.google)google.accounts.oauth2.revoke(gAccessToken,()=>{});
    gAccessToken=null;su(null);se([]);sse(null);setSCR("login");
  };
  const reloadEntries=async(importedEntries,importedLivros)=>{
    if(importedEntries){
      // Importação: mescla entradas importadas com as existentes
      se(prev=>{
        const existingIds=new Set(prev.map(e=>e.id));
        const novas=importedEntries.filter(e=>!existingIds.has(e.id));
        const atualizadas=prev.map(e=>{
          const imp=importedEntries.find(i=>i.id===e.id);
          return imp||e;
        });
        return[...atualizadas,...novas].sort((a,b)=>new Date(b.date)-new Date(a.date));
      });
      if(importedLivros&&importedLivros.length>0){
        sliv(prev=>{
          const existingIds=new Set(prev.map(l=>l.id));
          const novos=importedLivros.filter(l=>!existingIds.has(l.id));
          const atualizados=prev.map(l=>{
            const imp=importedLivros.find(i=>i.id===l.id);
            return imp||l;
          });
          return[...atualizados,...novos].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        });
      }
    }else{
      try{const e=await dbLoad();se(e);}catch(e){console.error(e);}
    }
  };

  if(scr==="loading")return<Loading/>;
  if(scr==="login")return<Login onSignIn={()=>gTokenClient&&gTokenClient.requestAccessToken()}/>;
  if(showDevoEd)return(
    <DevoEditor entry={devoEdit} user={user} onSave={async(e)=>{await saveDevo(e);}} onCancel={()=>sSDE(false)} mob={mob}/>
  );
  if(scr==="editor")return(
    <Editor eRef={vRef} content={ec} sc={sec} tags={et} st={set} font={ef} sf={sef} bg={ebg} sbg={sebg} fontSize={efz} sfz={sefz}
      date={selDate} sd={ssd} onSave={saveEntry} onCancel={()=>setSCR("diary")} mob={mob} saving={saving} isFrase={isFrase}/>
  );

  const sbProps={entries,user,selDate,setSel:ssd,stag,sstag:sst,selEntry,setSE:sse,open:openEd,logout,showPdf:()=>spdf(true),showBackup:()=>sbkp(true),section,setSection:setSec};

  /* Mobile: viewer frase */
  if(mob&&mobEnt&&selEntry&&selEntry.type==="frase")return(
    <><div style={{height:"100vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
      <FraseViewer entry={selEntry} viewRef={vRef} onEdit={()=>openEd(selEntry,new Date(selEntry.date),true)} onDel={()=>del(selEntry.id)} onPng={png} onBack={()=>sme(false)} mob={true} saving={saving}/>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Mobile: viewer diário */
  if(mob&&mobEnt&&selEntry)return(
    <><div style={{height:"100vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
      <Viewer entry={selEntry} viewRef={vRef} onEdit={()=>openEd(selEntry)} onDel={()=>del(selEntry.id)} onPng={png} onBack={()=>sme(false)} mob={true} saving={saving}/>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Mobile: devo */
  if(mob&&section==="devo")return(
    <><div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F7F3EE"}}>
      <div style={{padding:"14px 18px 10px",borderBottom:"1px solid #EDE5DC",background:"white",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:"6px"}}>
          {[{k:"diary",icon:"📖"},{k:"frases",icon:"🌸"},{k:"devo",icon:"✝️"},{k:"livros",icon:"📚"}].map(({k,icon})=>(
            <button key={k} onClick={()=>setSec(k)} style={{padding:"6px 12px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"13px",fontFamily:"'Lora',serif",fontWeight:section===k?700:400,background:section===k?(k==="frases"?"#EDD4FF":k==="devo"?"#F5E8C0":k==="livros"?SAGE:TERRACOTTA):"#F5EDE0",color:section===k?"white":"#8a7d70"}}>{icon}</button>
          ))}
        </div>
        <button onClick={logout} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif"}}>Sair</button>
      </div>
      <div style={{flex:1,overflow:"hidden"}}>
        <DevoSection entries={entries} user={user} onSave={saveDevo} onDel={del} openEditor={e=>{sDE(e||null);sSDE(true);}} mob={true}/>
      </div>
      <div style={{borderTop:"1px solid #EDE5DC",padding:"10px 28px 14px",display:"flex",justifyContent:"space-around",alignItems:"center",background:"white",flexShrink:0}}>
        <button onClick={()=>setSec("diary")} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📖</span>Diário</button>
        <button onClick={()=>spdf(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📄</span>PDF</button><button onClick={()=>sbkp(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>💾</span>Backup</button>
      </div>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Mobile: livros */
  if(mob&&section==="livros")return(
    <><div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F7F3EE"}}>
      <div style={{padding:"14px 18px 10px",borderBottom:"1px solid #EDE5DC",background:"white",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:"6px"}}>
          {[{k:"diary",icon:"📖"},{k:"frases",icon:"🌸"},{k:"devo",icon:"✝️"},{k:"livros",icon:"📚"}].map(({k,icon})=>(
            <button key={k} onClick={()=>setSec(k)} style={{padding:"6px 12px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"13px",fontFamily:"'Lora',serif",fontWeight:section===k?700:400,background:section===k?(k==="frases"?"#EDD4FF":k==="devo"?"#F5E8C0":k==="livros"?SAGE:TERRACOTTA):"#F5EDE0",color:section===k?"white":"#8a7d70"}}>{icon}</button>
          ))}
        </div>
        <button onClick={logout} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif"}}>Sair</button>
      </div>
      <div style={{flex:1,overflow:"hidden"}}>
        <LivrosSection livros={livros} onSave={saveLivro} onDel={delLivro} mob={true}/>
      </div>
      <div style={{borderTop:"1px solid #EDE5DC",padding:"10px 28px 14px",display:"flex",justifyContent:"space-around",alignItems:"center",background:"white",flexShrink:0}}>
        <button onClick={()=>setSec("diary")} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📖</span>Diário</button>
        <button onClick={()=>spdf(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📄</span>PDF</button><button onClick={()=>sbkp(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>💾</span>Backup</button>
      </div>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Mobile: frases grid */
  if(mob&&section==="frases")return(
    <><div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F7F3EE"}}>
      <div style={{padding:"16px 18px 12px",borderBottom:"1px solid #EDE5DC",background:"white",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:"8px"}}>
          {[{k:"diary",icon:"📖"},{k:"frases",icon:"🌸"},{k:"devo",icon:"✝️"},{k:"livros",icon:"📚"}].map(({k,icon})=>(
            <button key={k} onClick={()=>setSec(k)} style={{padding:"7px 12px",borderRadius:"10px",border:"none",cursor:"pointer",fontSize:"13px",fontFamily:"'Lora',serif",fontWeight:section===k?700:400,background:section===k?(k==="frases"?"#EDD4FF":k==="devo"?"#F5E8C0":k==="livros"?SAGE:TERRACOTTA):"#F5EDE0",color:section===k?"white":"#8a7d70"}}>
              {icon}
            </button>
          ))}
        </div>
        <button onClick={logout} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif"}}>Sair</button>
      </div>
      <div style={{flex:1,overflow:"hidden"}}>
        <FrasesSection entries={entries} user={user} onSave={saveFrase} onDel={del} openFullEditor={e=>{sse(e);openEd(e,new Date(e.date),true);}} mob={true}/>
      </div>
      <div style={{borderTop:"1px solid #EDE5DC",padding:"10px 28px 14px",display:"flex",justifyContent:"space-around",alignItems:"center",background:"white",flexShrink:0}}>
        <button onClick={()=>setSec("diary")} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📖</span>Diário</button>
        <button onClick={()=>spdf(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>📄</span>PDF</button><button onClick={()=>sbkp(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"11px",color:"#c5b8a8",fontFamily:"'Lora',serif",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><span style={{fontSize:"20px"}}>💾</span>Backup</button>
      </div>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Mobile: diário */
  if(mob)return(
    <><Sidebar {...sbProps} mob={true} onEntryClick={e=>{sse(e);sme(true);}}/>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );

  /* Desktop */
  return(
    <><div style={{display:"flex",height:"100vh",fontFamily:"'Lora',Georgia,serif",background:"#F7F3EE"}}>
      <Sidebar {...sbProps} mob={false}/>
      <main style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {section==="livros"?(
          <LivrosSection livros={livros} onSave={saveLivro} onDel={delLivro} mob={false}/>
        ):section==="devo"?(
          <DevoSection entries={entries} user={user} onSave={saveDevo} onDel={del} openEditor={e=>{sDE(e||null);sSDE(true);}} mob={false}/>
        ):section==="frases"?(
          <FrasesSection entries={entries} user={user} onSave={saveFrase} onDel={del} openFullEditor={e=>{sse(e);openEd(e,new Date(e.date),true);}} mob={false}/>
        ):selEntry?(
          selEntry.type==="frase"
            ?<FraseViewer entry={selEntry} viewRef={vRef} onEdit={()=>openEd(selEntry,new Date(selEntry.date),true)} onDel={()=>del(selEntry.id)} onPng={png} mob={false} saving={saving}/>
            :<Viewer entry={selEntry} viewRef={vRef} onEdit={()=>openEd(selEntry)} onDel={()=>del(selEntry.id)} onPng={png} mob={false} saving={saving}/>
        ):(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"10px"}}>
            <div style={{fontSize:"56px"}}>📖</div>
            <p style={{fontFamily:"'Playfair Display',serif",fontSize:"22px",color:"#b5a898"}}>Selecione uma entrada</p>
            <p style={{fontSize:"13px",color:"#d5c8b8"}}>ou comece uma nova</p>
            <button onClick={()=>openEd(null,new Date())} style={{marginTop:"12px",background:TERRACOTTA,color:"white",border:"none",borderRadius:"14px",padding:"12px 28px",fontSize:"14px",cursor:"pointer",fontFamily:"'Playfair Display',serif"}}>Escrever hoje</button>
          </div>
        )}
      </main>
    </div>{pdfOpen&&<PdfModal entries={entries} onClose={()=>spdf(false)}/>}{backupOpen&&<BackupModal entries={entries} livros={livros} user={user} onImport={reloadEntries} onClose={()=>sbkp(false)}/>}</>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/meu-diario/sw.js");});}</script>
</body>
</html>
